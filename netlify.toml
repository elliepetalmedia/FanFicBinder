[build]
  command = "npm run build"
  functions = "functions"
  publish = "dist/public"

[functions]
  node_bundler = "esbuild"

# The proxy function owns /api/proxy through its exported config. This also
# removes the default /.netlify/functions/proxy alias and applies edge limits.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# SPA fallback (prevents 404s on reload)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
